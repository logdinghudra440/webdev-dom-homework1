<!DOCTYPE html>
<html>

<head>
  <title>Проект "Комменты"</title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="container">
    <ul class="comments" id="list">
    </ul>
    <div class="add-form">
      <input id="name" type="text" class="add-form-name" placeholder="Введите ваше имя" />
      <textarea id="com" type="textarea" class="add-form-text" placeholder="Введите ваш коментарий" rows="4"></textarea>
      <div class="add-form-row">
        <button class="add-form-button" id="add">Написать</button>
      </div>
    </div>
  </div>
</body>

<script>
  "use strict";
  //объявили переменные
  const userName = document.getElementById("name");
  const comment = document.getElementById("com");
  const button = document.getElementById("add");
  const list = document.getElementById("list");
  const oldHtml = list.innerHTML;

  console.log("It works!");
  //сделали массив с комментариями
  const comments = [
    {
     name: "Глеб Фокин",
     date: "12.02.22 12:18",
     text: "Это будет первый комментарий на этой странице",
     likes: 3,
     isLiked: false
    },
    {
     name: "Варвара Н.",
     date: "13.02.22 19:22",
     text: "Мне нравится как оформлена эта страница! ❤",
     likes: 75,
     isLiked: true
    }
  ]

  function sanitize(str) {
    return str.replaceAll('<', '&lt;').replaceAll('>', '&gt;');
}


  //зарендили прошлый код
  function renderComments() {
  const htmlString = comments.map(function(items, index){
    let likeClass = '';
    if (items.isLiked === true) {
    likeClass = '-active-like';
    } else {
    likeClass = '';
    }
    return`
    <li class="comment" data-index="${index}">
          <div class="comment-header">
            <div>${items.name}</div>
            <div>${items.date}</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              ${items.text}
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">${items.likes}</span>
              <button class="like-button  ${likeClass}"></button>
            </div>
          </div>
        </li>`
  }) 
  list.innerHTML = htmlString.join('');
}
renderComments();

button.addEventListener("click", () => {
    if (userName.value === "") {
      userName.style.border = "1px solid red";
      return;
    }
    if (comment.value === "") {
      comment.style.border = "1px solid red";
      return;
}
    const name = userName.value;
    const text = comment.value; 
    const date = new Date();
    const formattedDate = `${date.getDate().toString().padStart(2, '0')}.${(date.getMonth() + 1).toString().padStart(2, '0')}.${date.getFullYear().toString().slice(-2)} ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
    const safeName = sanitize(name);
    const safeText = sanitize(text);
    
    const comNew = {
    name: safeName,
    date: formattedDate,
    text: safeText,
    likes: 0,
    isLiked: false
    };
    comments.push(comNew);
    userName.value = "";
    comment.value = "";
    userName.style.border = "";
    comment.style.border = "";
    renderComments();
  });

  list.addEventListener("click", (event) => {
    event.stopPropagation();
    if (event.target.classList.contains('like-button')){
    const li = event.target.closest('.comment');
    const index = li.dataset.index;
    const comment = comments[index];
    
    if (comment.isLiked === false) {
      comment.isLiked = true;
      comment.likes = comment.likes + 1;
    } else {
      comment.isLiked = false;
      comment.likes = comment.likes - 1;
    }
    renderComments();
  }});
 /*  const commentsElements = document.querySelectorAll(".comment");
  for (const commentElement of commentsElements){
    commentElement.addEventListener("click", () => {
      const currentComment = comments[Number(commentElement.dataset.index)];
      comment.value = `${currentComment.name}: ${currentComment.text}`;
    })
  } */

  list.addEventListener("click", (event) => {
    const commentElement = event.target.closest('.comment');
    const index = Number(commentElement.dataset.index);
    const findArray = comments[index];
    comment.value = findArray.text
  });
  

</script>

</html>

<!DOCTYPE html>
<html>

<head>
  <title>Проект "Комменты"</title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="container">
    <ul class="comments" id="list">
      <li class="comment">
        <div class="comment-header">
          <div>Глеб Фокин</div>
          <div>12.02.22 12:18</div>
        </div>
        <div class="comment-body">
          <div class="comment-text">
            Это будет первый комментарий на этой странице
          </div>
        </div>
        <div class="comment-footer">
          <div class="likes">
            <span class="likes-counter">3</span>
            <button class="like-button"></button>
          </div>
        </div>
      </li>
      <li class="comment">
        <div class="comment-header">
          <div>Варвара Н.</div>
          <div>13.02.22 19:22</div>
        </div>
        <div class="comment-body">
          <div class="comment-text">
            Мне нравится как оформлена эта страница! ❤
          </div>
        </div>
        <div class="comment-footer">
          <div class="likes">
            <span class="likes-counter">75</span>
            <button class="like-button -active-like"></button>
          </div>
        </div>
      </li>
    </ul>
    <div class="add-form">
      <input id="name" type="text" class="add-form-name" placeholder="Введите ваше имя" />
      <textarea id="com" type="textarea" class="add-form-text" placeholder="Введите ваш коментарий" rows="4"></textarea>
      <div class="add-form-row">
        <button class="add-form-button" id="add">Написать</button>
      </div>
    </div>
  </div>
</body>

<script>
  "use strict";
  const userName = document.getElementById("name");
  const comment = document.getElementById("com");
  const button = document.getElementById("add");
  const list = document.getElementById("list");
  const oldHtml = list.innerHTML;


  function createCommentTemplate(name, text) {
    const date = new Date();
    return `
         <li class="comment">
          <div class="comment-header">
            <div>${name}</div>
            <div>${date.toLocaleDateString()}</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              ${text}
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">0</span>
              <button class="like-button"></button>
            </div>
          </div>
        </li>
    `;
  }
  button.addEventListener("click", () => {
    if (userName.value === "") {
      userName.style.borderColor = "red";
      return;
    }

    const name = userName.value;
    const text = comment.value;
    const newCom = createCommentTemplate(name, text);
    list.innerHTML = oldHtml + newCom;
  });

  console.log("It works!");
</script>

</html>
